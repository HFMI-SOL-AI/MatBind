[build-system]
requires = ["setuptools<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matbind"
description = "A package for binding material modalities."
version = "0.3.2"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sol-AI team", email = "sol-ai@fz-juelich.de" }]
keywords = ["embeddings", "contrastive learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: Unix",
  "Operating System :: MacOS",
]

requires-python = ">=3.11, <3.13"
dependencies = [
  "chromadb>=1.2.1",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "torch_geometric>=2.0.0",
  "numpy>=1.26.0,<2.0",
  "transformers>=4.46.0",
  "datasets>=3.0.0",
  "fire>=0.5.0",
  "rdkit>=2024.3.1",
  "pyarrow>=15.0.0",
  "pandas>=2.0.0",
  "polars>=1.0.0",
  "info-nce-pytorch>=0.1.4",
  "hydra-core==1.3.2",
  "lightning>=2.0.0",
  "torchmetrics>=0.11.4",
  "rootutils>=1.0.0",
  "pre-commit>=3.0.0",
  "class_resolver>=0.5.0",
  "rich>=13.0.0",
  "wandb>=0.16.0",
  "hydra-colorlog==1.2.0",
  "hydra-optuna-sweeper==1.2.0",
  "omegaconf>=2.3.0",
  "pymatgen>=2024.1.1",
  "torchinfo>=1.8.0",
  "mkdocs>=1.4.2",
  "mkdocs-material>=8.5.10",
  "mkdocstrings[python]>=0.19.0",
  "scikit-learn>=1.7.2",
  "seaborn>=0.13.2",
]

# On Linux aarch64 NVIDIA systems, resolve PyTorch from the CUDA wheel index
# instead of the CPU-only wheels that may be selected from PyPI.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }
torchvision = { index = "pytorch-cu124", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }

[project.optional-dependencies]
dev = [
  "codecov-cli>=0.4.1",
  "pytest>=7.4.0",
  "pytest-cov>=3.0.0",
  "ruff>=0.0.285",
  "pytest>=8.4.2",
]

docs = [
  "mkdocs-material>=9.4.0",
  "mkdocstrings[python]>=0.22.0",
  "mkdocs-gen-files>=0.5.0",
  "mkdocs-literate-nav>=0.6.0",
  "pillow>=10.0.0",
  "cairosvg>=2.7.1",
]

[tool.setuptools.package-data]
template = ["py.typed"]

[tool.pyright]
include = ["template"]
exclude = ["**/__pycache__"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-p no:warnings", "--import-mode=importlib"]
xfail_strict = true
pythonpath = "src"
testpaths = ["tests"]

[tool.black]
exclude = '''
/(
    \.git
  | \.tox
)/
'''
skip-magic-trailing-comma = true

[tool.isort]
profile = 'black'
skip_gitignore = true

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "except ImportError",
]

[tool.ruff]
# line-length = 88
line-length = 130
lint.select = [
  "E",
  "F",
  "W",   # flake8
  "B",   # flake8-bugbear
  "I",   # isort
  "ARG", # flake8-unused-arguments
  "C4",  # flake8-comprehensions
  "EM",  # flake8-errmsg
  "ICN", # flake8-import-conventions
  "ISC", # flake8-implicit-str-concat
  "G",   # flake8-logging-format
  "PGH", # pygrep-hooks
  "PIE", # flake8-pie
  "PL",  # pylint
  "PT",  # flake8-pytest-style
  "PTH", # flake8-use-pathlib
  "RET", # flake8-return
  "RUF", # Ruff-specific
  "SIM", # flake8-simplify
  "T20", # flake8-print
  "UP",  # pyupgrade
  "YTT", # flake8-2020
  "EXE", # flake8-executable
  "NPY", # NumPy specific rules
  "PD",  # pandas-vet
]
lint.extend-ignore = [
  "PLR",    # Design related pylint codes
  "E501",   # Line too long
  "B028",   # No explicit stacklevel
  "EM101",  # Exception must not use a string literal
  "EM102",  # Exception must not use an f-string literal
  "G004",   # f-string in Logging statement
  "RUF015", # Prefer next(iter())
  "RET505", # Unnecessary `elif` after `return`
  "I001",  # isort found an import in the wrong position
]
lint.typing-modules = ["mypackage._compat.typing"]
lint.unfixable = [
  "T20",  # Removes print statements
  "F841", # Removes unused variables
]
lint.flake8-unused-arguments.ignore-variadic-names = true
lint.pydocstyle.convention = "numpy"
lint.isort.known-first-party = ["template"]
src = ["src"]
exclude = []
extend-exclude = ["tests"]

[tool.docformatter]
pre-summary-newline = true
black = true

[tool.mypy]
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
no_implicit_optional = false
disable_error_code = "annotation-unchecked"

[project.scripts]


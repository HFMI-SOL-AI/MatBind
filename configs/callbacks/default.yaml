defaults:
  - model_checkpoint
  - early_stopping
  - model_summary
  - rich_progress_bar
  - learning_rate_monitor
  - _self_

model_checkpoint:
  dirpath: ${paths.checkpoint_dir}
  filename: "epoch_{epoch:03d}"
  monitor: "valid/loss"
  mode: "min"
  save_last: True
  auto_insert_metric_name: False

early_stopping:
  monitor: "valid/loss"
  patience: 7
  mode: "min"

model_summary:
  max_depth: -1
